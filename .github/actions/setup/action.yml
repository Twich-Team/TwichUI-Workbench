name: Locked Workbench test environment
description: Clean locked environments, cached package downloads, signed OS dependencies.
inputs:
  browser:
    description: Install Chromium and its supported OS dependencies.
    default: 'false'
  lua:
    description: Install the existing Lua runtime and reference fonts.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: requirements.lock
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - shell: bash
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements.lock
        npm ci
    - name: Verify signed Ubuntu mirror
      if: inputs.lua == 'true' || inputs.browser == 'true'
      shell: bash
      run: |
        mirror_release=$(mktemp "${RUNNER_TEMP}/workbench-ubuntu-InRelease.XXXXXX")
        curl --fail --location --retry 2 --connect-timeout 10 --max-time 30 \
          https://mirrors.mit.edu/ubuntu/dists/noble/InRelease -o "$mirror_release"
        gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$mirror_release"
        test -f /etc/apt/apt-mirrors.txt
        sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRRORS'
        https://mirrors.mit.edu/ubuntu/	priority:1
        https://archive.ubuntu.com/ubuntu/	priority:2
        https://security.ubuntu.com/ubuntu/	priority:3
        MIRRORS
    - name: Install Chromium with supported OS dependencies
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Install Lua and reference fonts
      if: inputs.lua == 'true'
      shell: bash
      run: |
        if [[ '${{ inputs.browser }}' != 'true' ]]; then sudo apt-get update; fi
        sudo apt-get install -y lua5.1 lua-bitop fonts-dejavu-core fonts-dejavu-mono
