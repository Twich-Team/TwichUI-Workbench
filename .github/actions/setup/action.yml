name: Locked Workbench test environment
description: Clean locked environments, cached package downloads, signed OS dependencies.
inputs:
  browser:
    description: Install Chromium and its supported OS dependencies.
    default: 'false'
  lua:
    description: Install the existing Lua runtime and reference fonts.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: requirements.lock
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - shell: bash
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements.lock
        npm ci
    - name: Verify signed Ubuntu mirror
      if: inputs.lua == 'true' || inputs.browser == 'true'
      shell: bash
      run: |
        mirror_release=$(mktemp "${RUNNER_TEMP}/workbench-ubuntu-InRelease.XXXXXX")
        verified_mirror=''
        for mirror_base in https://mirrors.mit.edu/ubuntu/ https://archive.ubuntu.com/ubuntu/; do
          if curl --fail --location --retry 2 --connect-timeout 10 --max-time 30 \
            "${mirror_base}dists/noble/InRelease" -o "$mirror_release" && \
            gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$mirror_release"; then
            verified_mirror=$mirror_base
            break
          fi
        done
        test -n "$verified_mirror"
        test -f /etc/apt/apt-mirrors.txt
        {
          printf '%s\tpriority:1\n' "$verified_mirror"
          for mirror_base in https://mirrors.mit.edu/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://security.ubuntu.com/ubuntu/; do
            if [[ $mirror_base != "$verified_mirror" ]]; then
              printf '%s\tpriority:2\n' "$mirror_base"
            fi
          done
        } | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
    - name: Install Chromium with supported OS dependencies
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Install Lua and reference fonts
      if: inputs.lua == 'true'
      shell: bash
      run: |
        if [[ '${{ inputs.browser }}' != 'true' ]]; then sudo apt-get update; fi
        sudo apt-get install -y lua5.1 lua-bitop fonts-dejavu-core fonts-dejavu-mono
