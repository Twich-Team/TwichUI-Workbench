name: Verify fixture application
on:
  push:
    # Only known reporting paths get fast-only push feedback. Unknown files,
    # authority documents and all pull requests still require the full suite.
    paths:
      - '**'
      - '!README.md'
      - '!docs/CURRENT_STATUS.md'
      - '!docs/CONTINUATION.md'
      - '!docs/PLAN.md'
      - '!docs/PROGRESS.md'
      - '!docs/CI_PERFORMANCE_20261111.md'
      - '!docs/history/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Build, contracts, schema and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build_artifact: ${{ steps.bundle.outputs.name }}
      backend_matrix: ${{ steps.matrix.outputs.backend }}
      browser_matrix: ${{ steps.matrix.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lua: 'false'
      - id: matrix
        run: python scripts/ci.py matrix >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api.generated.ts
      - run: npx vitest run --config frontend/vite.config.ts
      - id: bundle
        shell: bash
        run: echo "name=frontend-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14
  backend:
    name: Backend ${{ matrix.shard }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.backend_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checks.outputs.build_artifact }}
          path: frontend/dist
      - run: .venv/bin/python scripts/ci.py backend --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.label }}-attempt-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14
  browser:
    name: Browser ${{ matrix.shard }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checks.outputs.build_artifact }}
          path: frontend/dist
      - run: npm run test-e2e -- --shard=${{ matrix.shard }}
      - name: Feature planning, references, continuation and combined result in the controlled installation
        if: matrix.shard == '1/4'
        env:
          WORKBENCH_E2E_EVERYDAY: '1'
        run: npm run test-e2e -- --grep 'Feature Workshop grounded intake|one browser feature reaches independent combined|feature files and source references|held feature needs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.label }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  visual:
    name: Visual regression
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checks.outputs.build_artifact }}
          path: frontend/dist
      - name: Compare screenshots using the reviewed Linux fonts
        run: |
          visual_config=$(mktemp -d "${RUNNER_TEMP}/workbench-fonts.XXXXXX")
          mkdir "$visual_config/fonts"
          cp e2e/visual-fonts.conf "$visual_config/"
          for family in DejaVuSans{,-Bold} DejaVuSerif{,-Bold} DejaVuSansMono{,-Bold,-Oblique,-BoldOblique}; do
            cp "/usr/share/fonts/truetype/dejavu/$family.ttf" "$visual_config/fonts/"
          done
          FONTCONFIG_FILE="$visual_config/visual-fonts.conf" npm run test-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  verify:
    name: verify
    if: always()
    needs: [checks, backend, browser, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require complete release acceptance
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci.py acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: full-release-acceptance-attempt-${{ github.run_attempt }}
          path: artifacts/ci/full-release-acceptance.json
          if-no-files-found: error
          retention-days: 14
