name: Verify fixture application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the Lua test runtime
        run: sudo apt-get install -y lua5.1 lua-bitop
      - run: npm run check
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api.generated.ts
      - run: npm test
      - run: npm run test-e2e
      - run: npm run test-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 14
